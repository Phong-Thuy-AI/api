# CẤU HÌNH HTTP (Cổng 80) - Dành cho việc cấp phát chứng chỉ Let's Encrypt (ACME Challenge) và tự động Redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.phongthuysimcathung.com; # Thay thế bằng domain chính thức của bạn

    # Đường dẫn xác thực của Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tự động chuyển hướng toàn bộ traffic HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# CẤU HÌNH HTTPS (Cổng 443) - Bảo mật bằng SSL Let's Encrypt
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.phongthuysimcathung.com; # Thay thế bằng domain chính thức của bạn

    # Đường dẫn file chứng chỉ SSL (Certbot sẽ tự động sinh ra tại đây)
    # Lưu ý: Khi chạy lần đầu chưa có certificate, bạn có thể tạm thời comment block 443 này lại,
    # chạy Nginx cổng 80 để Certbot xác thực xong rồi mới mở lại block 443 này.
    ssl_certificate /etc/letsencrypt/live/api.phongthuysimcathung.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phongthuysimcathung.com/privkey.pem;

    # Cấu hình bảo mật SSL tiêu chuẩn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # API Backend Proxy (Chuyển tiếp yêu cầu sang Node App container cổng 3000)
    location / {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io Real-time Chat Proxy (Hỗ trợ WebSocket Upgrade)
    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs Nginx
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
}
