name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_COMPOSE_FILE: ${{ secrets.DOCKER_COMPOSE_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DOCKER_COMPOSE_FILE
          script: |
            set -e

            cd "${{ secrets.APP_DIR }}"
            COMPOSE_FILE="${DOCKER_COMPOSE_FILE:-docker-compose.yml}"

            echo "Pulling latest code..."
            git pull origin main

            echo "Building and restarting API container..."
            docker compose -f "$COMPOSE_FILE" up -d --build api

            echo "Checking containers..."
            docker compose -f "$COMPOSE_FILE" ps

            echo "Cleaning up unused images..."
            docker image prune -f

            echo "Deploy completed"
